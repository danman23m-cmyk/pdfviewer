plugins { id 'com.android.application' }

android {
    namespace 'com.docuview.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.docuview.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH') != null && !System.getenv('ANDROID_KEYSTORE_PATH').isEmpty()) signingConfig signingConfigs.release
        }
    }
}
