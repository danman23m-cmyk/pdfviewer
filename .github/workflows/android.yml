
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release signing key
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_BASE64" ]; then
            echo "Signing key secret is missing."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/docuview-release.jks"

          printf '%s\n' "$KEY_BASE64" \
            | sed '/BEGIN CERTIFICATE/d; /END CERTIFICATE/d' \
            | tr -d '\r\n ' \
            | base64 --decode > "$KEY_FILE"

          test -s "$KEY_FILE"
          echo "ANDROID_KEYSTORE_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DocuView-signed-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
